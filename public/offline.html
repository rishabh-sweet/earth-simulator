<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wanderglobe — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0015;
      color: #e9eeff;
      font-family: 'Rajdhani', 'Helvetica Neue', Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; text-align: center; padding: 24px;
    }
    .globe { font-size: 72px; margin-bottom: 24px; opacity: 0.7; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    p { color: rgba(233,238,252,0.55); font-size: 16px; line-height: 1.6; max-width: 340px; }
    a {
      display: inline-block; margin-top: 28px; padding: 12px 28px;
      background: rgba(110,179,255,0.15); border: 1px solid rgba(110,179,255,0.3);
      border-radius: 24px; color: #6eb3ff; text-decoration: none;
      font-size: 15px; font-weight: 600;
    }
    a:hover { background: rgba(110,179,255,0.25); }
  </style>
</head>
<body>
  <div class="globe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" width="48" height="48" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg></div>
  <h1>You're offline</h1>
  <p>Your globe still works — any pins you've saved are right here.<br/>Changes will sync when you're back online.</p>
  <a href="/globe/">Open my globe</a>
</body>
</html>
