<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanderglobe — Your Globe</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Three.js renders into this canvas -->
    <canvas id="canvas"></canvas>

    <!-- Wanderglobe brand, linking back to the landing page -->
    <a id="brand" href="/" aria-label="Wanderglobe — home">
      <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="wgGlobe" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f2f6ff" />
            <stop offset="1" stop-color="#7aa7ff" />
          </linearGradient>
        </defs>
        <circle cx="24" cy="29" r="13" stroke="url(#wgGlobe)" stroke-width="1.7" />
        <ellipse cx="24" cy="29" rx="5.6" ry="13" stroke="url(#wgGlobe)" stroke-width="1.1" opacity="0.85" />
        <path d="M11.7 25.2h24.6M12.1 33h23.8" stroke="url(#wgGlobe)" stroke-width="1.1" opacity="0.85" />
        <path d="M24 4.6a5.2 5.2 0 0 1 5.2 5.2c0 3.9-3.3 5.4-5.2 8.6-1.9-3.2-5.2-4.7-5.2-8.6A5.2 5.2 0 0 1 24 4.6z" stroke="url(#wgGlobe)" stroke-width="1.7" />
        <circle cx="24" cy="9.8" r="1.9" fill="url(#wgGlobe)" />
      </svg>
      <span>Wanderglobe</span>
    </a>

    <!-- Black layer that fades in/out during the view transitions -->
    <div id="fade"></div>

    <!-- Focused-body overlay: connector lines + name + data callouts -->
    <div id="info">
      <svg id="info-lines"></svg>
      <div id="info-name"></div>
      <div id="info-callouts"></div>
    </div>

    <!-- Buttons + on-screen hint -->
    <button id="btn-back" class="ui-btn">← Back</button>
    <button id="btn-earth" class="ui-btn">⌂ Earth view</button>
    <div id="hint"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
